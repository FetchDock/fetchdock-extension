name: Publish New Version
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Replace manifest version with the release tag
        run: |
          # replace the version: (ie: '0.1.0') with the release tag
            sed -i "s/version: \'[0-9\.]\+\'/version: \'${{ github.event.release.tag_name }}\'/g" ./wxt.config.ts
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          cache: true
      - name: Install dependencies
        run: pnpm install
      - name: Create Chrome Extension Package
        run: pnpm zip
      - name: Create Firefox Extension Package
        run: pnpm zip:firefox
      - name: Publish to Release
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: './.output/*.zip'
          tags: true
          verbose: true