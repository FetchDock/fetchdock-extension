name: Publish New Version
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Replace manifest version with the release tag
        run: |
          # replace the version: (ie: '0.1.0') with the release tag
            sed -i "s/version: '[^']*'/version: '${{ github.event.release.tag_name }}'/" ./wxt.config.ts
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          cache: true
      - name: Install dependencies
        run: pnpm install
      - name: Create Chrome Extension Package
        run: pnpm zip
      - name: Create Firefox Extension Package
        run: pnpm zip:firefox
      - name: Publish to Release
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: './.output/*.zip'
          tags: true
          verbose: true
      - name: Submit to stores
        run: |
          pnpm wxt submit \
          --chrome-zip ./.output/*-chrome.zip \
          --firefox-zip ./.output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: default
          CHROME_SKIP_SUBMIT_REVIEW: false